[project]
name = "icarus-trader"
version = "0.1.0"
description = "Dollar-cost average $25/day into TQQQ on Alpaca."
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.33",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["icarus_trader"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
